name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: CV.tex
          working_directory: cv
          latexmk_use_xelatex: true
      - name: Publish CV PDF
        run: |
          mkdir -p public/assets/pdf
          cp cv/CV.pdf public/assets/pdf/cv.pdf
          test -s public/assets/pdf/cv.pdf
      - name: Build with Astro
        uses: withastro/action@v3
      - name: Verify generated site
        run: npm run verify

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
